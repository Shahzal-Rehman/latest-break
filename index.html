<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TimeGuardians AI WebApp</title>
</head>
<body>
  <h1>🚀 TimeGuardians AI WebApp</h1>
  <p>Integrated with Azure Functions (Node.js)</p>
  <button onclick="callAPI()">Call Azure API</button>
  <pre id="result"></pre>

  <script>
    async function callAPI() {
      const response = await fetch('/api/hello');
      const data = await response.json();
      document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
